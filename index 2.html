const bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
document.querySelector('#login').addEventListener('submit',async e=>{
 e.preventDefault();const button=e.target.querySelector('button');button.disabled=true;document.querySelector('#error').textContent='';
 let files;
 try{
 if(document.querySelector('#user').value.trim()!=='ilona')throw Error('login');
 const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.querySelector('#password').value),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt:bytes(sealed.salt),iterations:250000},material,{name:'AES-GCM',length:256},false,['decrypt']);
 files=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(sealed.iv)},key,bytes(sealed.data))));
 }catch{document.querySelector('#error').textContent='Не удалось войти. Проверь логин и пароль.';button.disabled=false;return;}
 try{
 const doc=new DOMParser().parseFromString(files['index.html'],'text/html');
 doc.querySelectorAll('script,link[rel="stylesheet"]').forEach(el=>el.remove());
 document.title=doc.title;document.head.querySelectorAll('style').forEach(el=>el.remove());
 const style=document.createElement('style');style.textContent=files['style.css'];document.head.append(style);
 document.body.innerHTML=doc.body.innerHTML;
 const url=source=>URL.createObjectURL(new Blob([source],{type:'text/javascript'}));
 const curriculum=url(files['curriculum.js']);const legacy=url(files['legacy-learning.js']);
 const learning=url(files['learning.js'].replaceAll("'./curriculum.js'",JSON.stringify(curriculum)).replaceAll("'./legacy-learning.js'",JSON.stringify(legacy)));
 const app=url(files['app.js'].replaceAll("'./learning.js'",JSON.stringify(learning)).replaceAll("'./curriculum.js'",JSON.stringify(curriculum)).replaceAll("'./legacy-learning.js'",JSON.stringify(legacy)));
 await import(app);[app,learning,curriculum,legacy].forEach(v=>URL.revokeObjectURL(v));
 const logout=document.createElement('button');logout.textContent='Выйти';logout.style.cssText='position:fixed;bottom:14px;right:14px;width:auto;z-index:1000;padding:10px 18px;background:#703b67;color:white;border:0;border-radius:12px;cursor:pointer';logout.onclick=()=>location.reload();document.body.append(logout);
 }catch{document.body.textContent='Не удалось запустить тренажёр. Обнови страницу и попробуй снова.';}
});</script></html>
